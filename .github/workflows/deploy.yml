name: Deploy Worker

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 可选：用仓库变量 WRANGLER_CONFIG 指定自己的配置文件（如 wrangler.prod.toml），
          # 其中可放真实的自定义域 / KV id 等个人配置；默认使用仓库内的 wrangler.toml
          WRANGLER_CONFIG: ${{ vars.WRANGLER_CONFIG }}
        # run 步骤恒走 shell，wrangler 在 devDependencies 里（wrangler-action@v3 是浮动 tag，
        # 上游曾出现 npx 不自动确认、命令不走 shell 导致参数原样透传的问题，故改为直接调用）
        run: npx wrangler deploy ${WRANGLER_CONFIG:+-c $WRANGLER_CONFIG}

      - name: Notify
        if: always()
        env:
          TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          JOB_STATUS: ${{ job.status }}
          TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/notify.mjs
